<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }} · Us</title>
    <meta name="description" content="A small archive of our years together.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@500;600&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Lora:ital,wght@0,400..700;1,400..700&family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>

    <!-- ==========================================================
         BACKGROUND DECORATION & ANIMATIONS (STANDALONE SECTION)
         ========================================================== -->
    <div class="ambient-bg" aria-hidden="true">
      <!-- 1. Interactive Cursor-Repelling Dot-Grid Canvas -->
      <canvas id="ambient-dot-canvas" class="ambient-grid-canvas"></canvas>

      <!-- 2. Stronger Coastal Blue Glow Orbs -->
      <span class="ambient-orb orb-1"></span>
      <span class="ambient-orb orb-2"></span>
      <span class="ambient-orb orb-3"></span>

      <!-- 3. Floating Minimalist Sparkles -->
      <span class="ambient-sparkle s1">✦</span>
      <span class="ambient-sparkle s2">·</span>
      <span class="ambient-sparkle s3">✦</span>
      <span class="ambient-sparkle s4">✧</span>
      <span class="ambient-sparkle s5">·</span>
      <span class="ambient-sparkle s6">✦</span>
      <span class="ambient-sparkle s7">✧</span>
      <span class="ambient-sparkle s8">·</span>
      <span class="ambient-sparkle s9">✦</span>
      <span class="ambient-sparkle s10">✧</span>
    </div>
    <script src="{{ url_for('static', filename='js/ambient-grid.js') }}" defer></script>

    {% if request.endpoint == 'home' %}
    <!-- Left Side Photo Frame -->
    <aside class="side-frame side-frame-left" aria-label="Left decorative photo">
      <div class="side-frame-inner">
        <img src="{{ url_for('static', filename='img/side-left.jpg') }}" alt="Our memory">
      </div>
    </aside>

    <!-- Right Side Photo Frame -->
    <aside class="side-frame side-frame-right" aria-label="Right decorative photo">
      <div class="side-frame-inner">
        <img src="{{ url_for('static', filename='img/side-right.jpg') }}" alt="Our memory">
      </div>
    </aside>
    {% endif %}

    <header class="site-header">
      <a class="brand" href="{{ url_for('home') }}" aria-label="Go to home">
        <span class="brand-mark">
          <svg width="30" height="30" fill="currentColor" viewBox="0 0 512 512" version="1.1" xml:space="preserve" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
            <g id="SVGRepo_iconCarrier"><!-- Uploaded to: SVG Repo, www.svgrepo.com, Generator: SVG Repo Mixer Tools --> <g id="jewel_ring-ring-diamond-valentine-jewellery"> <path d="M311.304,146.57l19.392-19.391c4.319-4.317,6.651-9.9,6.945-15.585c0-0.028,0.016-0.051,0.016-0.079 c0-0.04-0.022-0.073-0.023-0.113c0.244-5.588-1.465-11.263-5.223-15.918L319.109,78.82c-4.064-5.039-9.196-8.885-14.914-11.413 c-0.092-0.048-0.188-0.072-0.282-0.116C299.025,65.176,293.726,64,288.242,64h-64.48c-5.481,0-10.78,1.175-15.667,3.291 c-0.1,0.047-0.202,0.072-0.3,0.124c-5.717,2.532-10.85,6.383-14.923,11.437l-13.258,16.602c-3.767,4.667-5.48,10.343-5.243,15.931 c-0.001,0.046-0.026,0.085-0.026,0.131c0,0.032,0.018,0.059,0.019,0.091c0.294,5.683,2.627,11.26,6.942,15.573l19.392,19.391 C144.153,168.662,104,223.667,104,288c0,83.84,68.16,152,152,152c83.84,0,152-68.16,152-152 C408,223.667,367.847,168.662,311.304,146.57z M264,119.516h51.734L264,171.246V119.516z M230.677,80h50.646L256,101.102 L230.677,80z M248,171.246l-51.734-51.73H248V171.246z M318.349,103.516h-40.248l23.245-19.369 c1.941,1.313,3.768,2.812,5.283,4.689L318.349,103.516z M205.352,88.867c1.524-1.891,3.358-3.398,5.307-4.717l23.241,19.365H193.65 L205.352,88.867z M256,392c-57.36,0-104-46.64-104-104c0-51.779,38.046-94.697,87.635-102.583C244.033,189.58,249.939,192,256,192 s11.967-2.42,16.365-6.583C321.955,193.303,360,236.221,360,288C360,345.36,313.36,392,256,392z"></path>
          </svg>
        </span>
        <span>Chúng ta</span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <span class="nav-liquid-drop" aria-hidden="true"></span>
        {% for item in pages %}
          {% if item.endpoint != "home" %}
            <a href="{{ item.path }}"
               class="{% if request.endpoint == item.endpoint or request.path == item.path %}is-active{% endif %}">
              {{ item.label }}
            </a>
          {% endif %}
        {% endfor %}
      </nav>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <p>
        Made for the two of us.<br>
        Kiet and Ngan
      </p>
      <span>♥</span>
    </footer>
    <script src="{{ url_for('static', filename='js/nav-liquid.js') }}" defer></script>
  </body>
</html>

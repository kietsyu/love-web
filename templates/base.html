<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }} · Us</title>
    <script>
      if (localStorage.getItem("theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    </script>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@500;600&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Lora:ital,wght@0,400..700;1,400..700&family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    {% if request.endpoint == 'home' %}
      <aside class="side-frame side-frame-left" aria-hidden="true">
        <div class="side-frame-inner">
          <span>Our memory</span>
          <img src="{{ url_for('static', filename='img/side-left.jpg') }}" alt="">
        </div>
      </aside>

      <aside class="side-frame side-frame-right" aria-hidden="true">
        <div class="side-frame-inner">
          <span>Our memory</span>
          <img src="{{ url_for('static', filename='img/side-right.jpg') }}" alt="">
        </div>
      </aside>
    {% endif %}

    <header class="site-header">
      <a class="brand" href="{{ url_for('home') }}" aria-label="Go to home">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="14" r="6" />
            <path d="M9 8L10.5 4.5H13.5L15 8" />
            <path d="M10.5 4.5L12 8L13.5 4.5" />
          </svg>
        </span>
        <span>Chúng ta</span>
      </a>
    </header>

    <nav class="site-nav" aria-label="Main navigation">
      <span class="nav-liquid-drop" aria-hidden="true"></span>
      {% for item in pages %}
        {% if item.endpoint != "home" %}
          <a href="{{ item.path }}"
             class="{% if request.endpoint == item.endpoint or request.path == item.path %}is-active{% endif %}">
            {{ item.label }}
          </a>
        {% endif %}
      {% endfor %}
    </nav>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <p>Made for the two of us.<br>Kiet and Ngan.</p>
      <span aria-hidden="true">♥</span>
    </footer>

    <!-- ==========================================================
         BACKGROUND DECORATION & ANIMATIONS (STANDALONE SECTION)
         ========================================================== -->
    <div class="ambient-bg" aria-hidden="true">
      <canvas id="ambient-dot-canvas" class="ambient-grid-canvas"></canvas>
      <span class="ambient-orb orb-1"></span>
      <span class="ambient-orb orb-2"></span>
      <span class="ambient-orb orb-3"></span>
    </div>

    <!-- Shared Viewport-Locked Photo Lightbox -->
    <div class="gallery-lightbox" id="gallery-lightbox" aria-hidden="true" role="dialog">
      <div class="lightbox-panel">
        <button class="lightbox-close" type="button" aria-label="Đóng ảnh">✕</button>
        <button class="lightbox-nav lightbox-prev" type="button" aria-label="Ảnh trước">&lt;</button>
        <figure class="lightbox-figure">
          <img id="lightbox-img" src="" alt="">
          <figcaption id="lightbox-caption"></figcaption>
        </figure>
        <button class="lightbox-nav lightbox-next" type="button" aria-label="Ảnh tiếp theo">&gt;</button>
      </div>
    </div>

    <!-- Floating Bottom-Right Dark Mode Toggle -->
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Chuyển giao diện sáng / tối" title="Chuyển chế độ sáng / tối">
      <span class="theme-icon-sun" aria-hidden="true">☀</span>
      <span class="theme-icon-moon" aria-hidden="true">☾</span>
    </button>

    <script src="{{ url_for('static', filename='js/ambient-grid.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/nav-liquid.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/gallery-lightbox.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/theme-toggle.js') }}" defer></script>
  </body>
</html>
